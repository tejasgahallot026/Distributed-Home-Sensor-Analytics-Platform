# Render has no MQTT broker, so the cloud deployment runs in demo mode:
# simulated sensors inside the web process, sent through the same ingest pipeline.
services:
  - type: web
    name: home-sensor-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 wsgi:application
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        fromDatabase:
          name: home-sensors-db
          property: connectionString
      - key: DEMO_MODE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
    plan: starter

databases:
  - name: home-sensors-db
    databaseName: sensors
    user: sensor_user
