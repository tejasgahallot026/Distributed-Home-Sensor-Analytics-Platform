# Full local stack: broker, database, web app and simulated sensors.
# Copy .env.example to .env first, then: docker compose up --build
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sensors
      POSTGRES_USER: sensor_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_user -d sensors"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://sensor_user:${POSTGRES_PASSWORD}@db:5432/sensors
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      ENABLE_MQTT: "1"
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  simulator:
    build: .
    command: python sensors/sensor_simulator.py
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      SIM_INTERVAL_SECONDS: "5"
    depends_on:
      - mosquitto
      - web
    restart: unless-stopped

volumes:
  postgres_data:
